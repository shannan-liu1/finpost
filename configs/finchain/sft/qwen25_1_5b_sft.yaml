model:
  base_model_id: Qwen/Qwen2.5-1.5B
  dtype: bfloat16
  use_safetensors: true
  gradient_checkpointing: false
  use_8bit_optimizer: false
  attn_implementation: null
data:
  sources:
    - finchain
  split_strategy: template_disjoint_fresh_seed_v2
  train_n: 2320
  validation_n: 870
  test_n: 870
  # Repo-native SFT trainer plumbing only. Public checkpoint selection uses the
  # explicit v2 validation split above; final reporting uses the v2 test split.
  val_split_pct: 5.0
  seed: 42
training:
  max_steps: 750
  warmup_steps: 75
  lr: 2.0e-5
  weight_decay: 0.01
  grad_accum_steps: 8
  grad_clip: 1.0
  val_every_n_steps: 100
  checkpoint_every_n_steps: 250
  per_device_batch_size: 1
  dataloader_num_workers: 2
  pin_memory: true
packing:
  max_seq_len: 1536
  isolate_documents: true
logging:
  wandb_project: finpost-finchain-sft
  run_name: qwen25-1p5b-finchain-v2-trl-sft-2gpu
checkpointing:
  save_dir: results/checkpoints/qwen25-1p5b-finchain-v2-trl-sft-2gpu
  retention_last_n: 4
  resume_from: null
